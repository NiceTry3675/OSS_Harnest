<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>BYO CORS 프로브</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         max-width: 900px; margin: 0 auto; padding: 24px; line-height: 1.6; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .warn { background: #fff4e5; border: 1px solid #f0c07a; color: #6b4400;
          padding: 10px 14px; border-radius: 6px; font-size: 14px; margin: 12px 0 20px; }
  @media (prefers-color-scheme: dark) {
    .warn { background: #33280f; border-color: #7a5f22; color: #f0d9a8; }
  }
  .vendor { border: 1px solid #d0d0d0; border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
  @media (prefers-color-scheme: dark) { .vendor { border-color: #444; } }
  .vendor h2 { font-size: 15px; margin: 0 0 4px; }
  .endpoint { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; opacity: .7;
              word-break: break-all; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=password], input[type=text] { flex: 1; min-width: 240px; padding: 6px 10px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    border: 1px solid #bbb; border-radius: 4px; background: transparent; color: inherit; }
  button { padding: 6px 16px; border-radius: 4px; border: 1px solid #666;
           background: transparent; color: inherit; cursor: pointer; font-size: 13px; }
  button:hover { background: rgba(128,128,128,.15); }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: rgba(128,128,128,.12); padding: 10px 12px; border-radius: 4px;
        font-size: 12px; white-space: pre-wrap; word-break: break-all; margin: 10px 0 0; }
  .verdict { font-weight: 700; }
  .pass { color: #1a7f37; } .fail { color: #cf222e; } .info { color: #8250df; }
  @media (prefers-color-scheme: dark) {
    .pass { color: #4ac26b; } .fail { color: #ff7b72; } .info { color: #d2a8ff; }
  }
  #copyAll { margin-top: 20px; }
</style>
</head>
<body>

<h1>BYO CORS 프로브</h1>
<p style="margin-top:0;opacity:.75;font-size:14px">
  브라우저에서 각 LLM 벤더 API로 <strong>직행</strong>이 되는지 실측한다. (SPEC §12 미결 3)
</p>

<div class="warn">
  <strong>키는 저장하지 않습니다.</strong> 입력값은 이 페이지 메모리에만 있고 새로고침하면 사라집니다.
  localStorage·서버 어디에도 보내지 않습니다.<br>
  <strong>반드시 <code>http://localhost</code>로 열어야 합니다.</strong>
  <code>file://</code>로 열면 출처가 <code>null</code>이라 실제 서비스 환경과 조건이 달라집니다.
</div>

<div id="vendors"></div>

<button id="copyAll">전체 결과 복사</button>
<pre id="summary" style="display:none"></pre>

<script>
// 판정 규칙:
//  - 응답이 왔다(상태코드를 읽을 수 있다) => CORS 통과. 401/429여도 통과다.
//    브라우저가 CORS로 막으면 상태코드조차 볼 수 없기 때문이다.
//  - fetch가 TypeError로 throw => CORS 차단 의심. 정확한 사유는 브라우저 콘솔에만 찍힌다
//    (JS에서 Access-Control-* 응답 헤더는 읽을 수 없다 — 명세상 노출 안 됨).
const VENDORS = [
  {
    id: "gemini",
    name: "Google Gemini (AI Studio 키)",
    endpoint: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent",
    keyLabel: "AIza... 형식",
    build: (key) => ({
      url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent",
      init: {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: "hi" }] }],
          generationConfig: { maxOutputTokens: 1 },
        }),
      },
    }),
  },
  {
    id: "anthropic",
    name: "Anthropic Claude",
    endpoint: "https://api.anthropic.com/v1/messages",
    keyLabel: "sk-ant-... 형식",
    note: "브라우저 직행 전용 헤더(anthropic-dangerous-direct-browser-access) 포함. 헤더 이름의 'dangerous'는 키 노출 위험에 대한 벤더의 경고다.",
    build: (key) => ({
      url: "https://api.anthropic.com/v1/messages",
      init: {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 1,
          messages: [{ role: "user", content: "hi" }],
        }),
      },
    }),
  },
  {
    id: "openai",
    name: "OpenAI",
    endpoint: "https://api.openai.com/v1/chat/completions",
    keyLabel: "sk-... 형식",
    note: "공식 문서에 브라우저 직행이 명시돼 있지 않음 — 동작하더라도 예고 없이 바뀔 수 있다.",
    build: (key) => ({
      url: "https://api.openai.com/v1/chat/completions",
      init: {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          max_tokens: 1,
          messages: [{ role: "user", content: "hi" }],
        }),
      },
    }),
  },
  {
    id: "openrouter",
    name: "OpenRouter (커스텀 프로바이더 대표)",
    endpoint: "https://openrouter.ai/api/v1/chat/completions",
    keyLabel: "sk-or-... 형식",
    build: (key) => ({
      url: "https://openrouter.ai/api/v1/chat/completions",
      init: {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({
          model: "openai/gpt-4o-mini",
          max_tokens: 1,
          messages: [{ role: "user", content: "hi" }],
        }),
      },
    }),
  },
  {
    id: "ollama",
    name: "로컬 Ollama (커스텀 프로바이더 대표)",
    endpoint: "http://localhost:11434/api/generate",
    keyLabel: "키 불필요 — 비워두세요",
    note: "로컬 서버. 기본 설정에서는 CORS가 막힐 수 있고, 그 경우 사용자가 OLLAMA_ORIGINS를 설정해야 한다.",
    build: () => ({
      url: "http://localhost:11434/api/generate",
      init: {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "llama3", prompt: "hi", stream: false, options: { num_predict: 1 } }),
      },
    }),
  },
];

const results = {};

function render() {
  const root = document.getElementById("vendors");
  root.innerHTML = "";
  for (const v of VENDORS) {
    const box = document.createElement("div");
    box.className = "vendor";
    box.innerHTML = `
      <h2>${v.name}</h2>
      <div class="endpoint">${v.endpoint}</div>
      ${v.note ? `<div style="font-size:12.5px;opacity:.75;margin-bottom:10px">${v.note}</div>` : ""}
      <div class="row">
        <input type="password" id="key-${v.id}" placeholder="${v.keyLabel}" autocomplete="off" />
        <button id="btn-${v.id}">호출</button>
      </div>
      <pre id="out-${v.id}" style="display:none"></pre>`;
    root.appendChild(box);
    document.getElementById("btn-" + v.id).onclick = () => run(v);
  }
}

async function run(v) {
  const btn = document.getElementById("btn-" + v.id);
  const out = document.getElementById("out-" + v.id);
  const key = document.getElementById("key-" + v.id).value.trim();

  btn.disabled = true;
  out.style.display = "block";
  out.textContent = "호출 중...";

  const lines = [];
  const t0 = performance.now();
  try {
    const { url, init } = v.build(key);
    const res = await fetch(url, init);
    const ms = Math.round(performance.now() - t0);
    let bodyText = "";
    let bodyReadable = true;
    try {
      bodyText = await res.text();
    } catch (e) {
      bodyReadable = false;
      bodyText = "(본문 읽기 실패: " + e + ")";
    }
    lines.push(`판정: CORS 통과 — 응답을 받았습니다`);
    lines.push(`HTTP ${res.status} ${res.statusText}  (${ms}ms)`);
    lines.push(`본문 판독: ${bodyReadable ? "가능" : "불가"}`);
    lines.push(`본문(앞 500자): ${bodyText.slice(0, 500)}`);
    results[v.id] = { verdict: "PASS", status: res.status, ms, bodyReadable, body: bodyText.slice(0, 500) };
    out.innerHTML = `<span class="verdict ${res.ok ? "pass" : "info"}">${lines[0]}</span>\n` +
                    lines.slice(1).join("\n");
  } catch (e) {
    const ms = Math.round(performance.now() - t0);
    lines.push(`판정: 차단 의심 — 응답 자체를 받지 못했습니다`);
    lines.push(`에러: ${e && e.name}: ${e && e.message}  (${ms}ms)`);
    lines.push(`※ 브라우저 개발자도구 콘솔에 CORS 관련 원문이 찍혔는지 확인하고 그대로 기록할 것.`);
    lines.push(`※ 네트워크 자체가 안 되는 경우(오프라인·주소 오타)와 구분해야 함.`);
    results[v.id] = { verdict: "BLOCKED?", error: String(e), ms };
    out.innerHTML = `<span class="verdict fail">${lines[0]}</span>\n` + lines.slice(1).join("\n");
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("copyAll").onclick = async () => {
  const payload = {
    실행시각: new Date().toISOString(),
    출처: location.origin,
    브라우저: navigator.userAgent,
    결과: results,
  };
  const text = JSON.stringify(payload, null, 2);
  const el = document.getElementById("summary");
  el.style.display = "block";
  el.textContent = text;
  try { await navigator.clipboard.writeText(text); } catch (_) {}
};

render();
</script>
</body>
</html>
