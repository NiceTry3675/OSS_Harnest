# Fly.io API server config for Harnest.
# Create the app once with:
#   fly apps create harnest-api-nicetry3675
#   fly volumes create harnest_data --size 1 --region nrt --app harnest-api-nicetry3675
#
# Then set secrets with:
#   fly secrets set SHARED_OPENAI_API_KEY=... --app harnest-api-nicetry3675
#   fly secrets set SHARED_GEMINI_API_KEY=... --app harnest-api-nicetry3675

app = "harnest-api-nicetry3675"
primary_region = "nrt"

[build]
  dockerfile = "apps/api/Dockerfile"
  build-target = "runtime"

[env]
  HARNEST_DB = "/data/harnest.db"
  HARNEST_CORS_ORIGINS = "http://localhost:5173,http://harnest.p-e.kr,https://harnest.p-e.kr"
  HARNEST_PROXY_RATE_LIMIT = "20"
  # Fly 프록시가 붙이는 방문자 IP 헤더 — 이 값이 없으면 서버는 헤더를 무시하고 접속 소켓 IP만 쓴다.
  HARNEST_TRUSTED_IP_HEADER = "fly-client-ip"

[[mounts]]
  source = "harnest_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  # 공유 키 프록시는 벤더 응답을 다 받은 뒤에야 첫 바이트를 보내므로, edge 유휴 한도(기본 60초)가
  # 서버의 상류 읽기 한도보다 짧으면 edge가 먼저 연결을 끊는다 — 벤더 쪽 생성·과금은 완주하고
  # 사용자는 산출물을 잃는다. Fly가 허용하는 최댓값은 900초다(더 크면 배포가 거부된다). 그래서 서버의
  # 읽기 한도는 출력 토큰 상한 × 30ms에 비례하되 HARNEST_PROXY_MAX_TIMEOUT(기본 780초)에서 멈추고,
  # 브라우저는 여기에 60초 여유를 더해 840초까지 기다린다. edge(900초)는 그 둘보다 뒤에 끊어야 서버의
  # 504·클라이언트의 시간 초과 안내가 사용자에게 닿는다. 읽기 한도 상한을 올리려면 이 값이 그보다
  # 60초 이상 커야 하는데, 900초를 넘길 수 없으므로 상한은 840초까지만 올릴 수 있다.
  [http_service.http_options]
    idle_timeout = 900

  # 프로세스는 떠 있어도 요청 경로가 깨진 배포를 걸러 낸다.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
