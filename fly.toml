# Fly.io API server config for Harnest.
# Create the app once with:
#   fly apps create harnest-api-nicetry3675
#   fly volumes create harnest_data --size 1 --region nrt --app harnest-api-nicetry3675
#
# Then set secrets with:
#   fly secrets set SHARED_OPENAI_API_KEY=... --app harnest-api-nicetry3675
#   fly secrets set SHARED_GEMINI_API_KEY=... --app harnest-api-nicetry3675

app = "harnest-api-nicetry3675"
primary_region = "nrt"

[build]
  dockerfile = "apps/api/Dockerfile"
  build-target = "runtime"

[env]
  HARNEST_DB = "/data/harnest.db"
  HARNEST_CORS_ORIGINS = "http://localhost:5173,http://harnest.p-e.kr,https://harnest.p-e.kr"
  HARNEST_PROXY_RATE_LIMIT = "20"
  # Fly 프록시가 붙이는 방문자 IP 헤더 — 이 값이 없으면 서버는 헤더를 무시하고 접속 소켓 IP만 쓴다.
  HARNEST_TRUSTED_IP_HEADER = "fly-client-ip"

[[mounts]]
  source = "harnest_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  # 프로세스는 떠 있어도 요청 경로가 깨진 배포를 걸러 낸다.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
